version: '3.9'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15
    container_name: los-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-los}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-los}
      POSTGRES_DB: ${POSTGRES_DB:-los}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-los}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: los-redpanda
    command:
      - redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 \
        --check=false --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092 \
        --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: los-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: los-keycloak
    command: start-dev --http-port=8080
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Monolithic Service (All services combined + Frontend)
  # This matches production deployment exactly
  # Configured to use Supabase database (from .env file)
  monolith:
    build:
      context: ..
      dockerfile: services/monolith/Dockerfile
    container_name: los-monolith
    environment:
      NODE_ENV: production
      PORT: 3000
      # Supabase Database Connection - explicitly set to Supabase
      DATABASE_URL: postgresql://postgres:i3Oy1wcItkORuVlU@db.orqupfsguquusnethtbt.supabase.co:5432/postgres?sslmode=require
      SUPABASE_URL: ${SUPABASE_URL:-https://orqupfsguquusnethtbt.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ycXVwZnNndXF1dXNuZXRodGJ0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NDI2MzcyNCwiZXhwIjoyMDc5ODM5NzI0fQ.JmNQZxevtxqpaKFJrcdzkAGmBEr_tQ2Dy1fCruMhnq8}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET: los-docs
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-secret-key-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-refresh-secret-key-min-32-chars}
    ports:
      - "3000:3000"
    # Configure DNS to use host's resolver - fixes Supabase hostname resolution in Docker
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Dependencies are optional - monolith can work without local postgres if using Supabase
    depends_on:
      minio:
        condition: service_healthy
      # postgres and redpanda are optional if using Supabase
      # postgres:
      #   condition: service_healthy
      # redpanda:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Mount source code for development (optional - comment out for production-like testing)
    # volumes:
    #   - ../services/monolith/src:/app/services/monolith/src:ro
    #   - ../shared:/app/shared:ro

volumes:
  pgdata:
  redpanda:
  minio:

