steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-monolith'
    args:
      - 'build'
      - '-f'
      - 'services/monolith/Dockerfile'
      - '-t'
      - '${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/monolith:${SHORT_SHA}'
      - '-t'
      - '${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/monolith:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-monolith-sha'
    args:
      - 'push'
      - '${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/monolith:${SHORT_SHA}'
    waitFor: ['build-monolith']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-monolith-latest'
    args:
      - 'push'
      - '${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/monolith:latest'
    waitFor: ['build-monolith']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/monolith:${SHORT_SHA}'
      - '--region=${_GCP_REGION}'
      - '--project=${PROJECT_ID}'
      - '--platform=managed'
      - '--port=3000'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--max-instances=20'
      - '--min-instances=1'
      - '--allow-unauthenticated'
      - '--service-account=los-cloud-run@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=${PROJECT_ID}:${_GCP_REGION}:${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars=NODE_ENV=development,PORT=3000,USE_GCP_SECRETS=true,GCP_PROJECT_ID=${PROJECT_ID}'
      - '--set-secrets=DATABASE_URL=projects/${PROJECT_ID}/secrets/${_DATABASE_SECRET_NAME}/versions/latest,KAFKA_BROKERS=projects/${PROJECT_ID}/secrets/${_KAFKA_SECRET_NAME}/versions/latest,KEYCLOAK_CONFIG=projects/${PROJECT_ID}/secrets/${_KEYCLOAK_SECRET_NAME}/versions/latest'
    waitFor: ['push-monolith-sha', 'push-monolith-latest']

substitutions:
  _GCP_REGION: 'us-central1'
  _ARTIFACT_REGISTRY: 'los-images'
  _SERVICE_NAME: 'los-monolith'
  _CLOUD_SQL_INSTANCE: 'los-db'
  _DATABASE_SECRET_NAME: 'database-url'
  _KAFKA_SECRET_NAME: 'kafka-brokers'
  _KEYCLOAK_SECRET_NAME: 'keycloak-config'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  timeout: '1200s'

images:
  - '${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/monolith:${SHORT_SHA}'
  - '${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/monolith:latest'


