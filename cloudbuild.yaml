steps:
  # Build the Docker image (monolith only)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'services/monolith/Dockerfile'
      - '-t'
      - '${_IMAGE_URL}'
      - '.'
    id: 'build'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_URL}'
    id: 'push'
    waitFor: ['build']

  # Deploy to Cloud Run
  # Note: Cloud Run sets PORT=8080 by default, our app reads process.env.PORT
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_IMAGE_URL}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--timeout=300'
      - '--startup-cpu-boost'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=DATABASE_URL=database-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest'
    id: 'deploy'
    waitFor: ['push']

substitutions:
  _SERVICE_NAME: 'los-single-service'
  _REGION: 'us-central1'
  _IMAGE_URL: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/los-images/monolith:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - '${_IMAGE_URL}'

